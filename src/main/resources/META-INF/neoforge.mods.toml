modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/traelmyx/why-stacks-of-16-reborn/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx, LaidBackSloth"
${logo_key} = "assets/wso16/icon.png"
description = '''Ender pearls, eggs, snowballs, signs, buckets and everything else that stacks to 16 now stacks to 64. Based on Why Stacks of 16? by LaidBackSloth.'''

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
